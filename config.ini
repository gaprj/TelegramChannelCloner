[ACCOUNT]
# Highly recommended: set to True to use two different accounts. 
# It massively reduces FloodWait bans, distributes the load, and speeds up the process.
USE_DUAL_ACCOUNT = True

[SETTINGS]
# Random anti-ban delays (in seconds) to mimic human behavior
FILE_DELAY_MIN = 2.0
FILE_DELAY_MAX = 4.0
BLOCK_DELAY_MIN = 6.0
BLOCK_DELAY_MAX = 12.0

# Threshold for triggering FastTelethon parallel transfer
FAST_THRESHOLD_MB = 30

# Max allowed sizes. Keep them slightly under the official 2000/4000 MB limits 
# to account for FastTelethon chunking overhead and strict Telegram server limits.
MAX_STANDARD_MB = 1950
MAX_PREMIUM_MB = 3950

